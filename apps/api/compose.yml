name: templateMonorepo

services:
  pg:
    container_name: templateMonorepo-pg
    image: postgres:17
    ports:
      - '127.0.0.1:${DOCKER_PG_PORT}:5432'
    environment:
      - POSTGRES_USER=${DOCKER_PG_USER}
      - POSTGRES_PASSWORD=${DOCKER_PG_PASSWORD}
      - POSTGRES_DB=${DOCKER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
