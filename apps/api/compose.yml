services:
  pg:
    container_name: templateMonorepo
    image: postgres:17
    ports:
      - '${DOCKER_PG_PORT}:5432'
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DOCKER_PG_USER}
      - POSTGRES_PASSWORD=${DOCKER_PG_PASSWORD}
      - POSTGRES_DB=${DOCKER_PG_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
